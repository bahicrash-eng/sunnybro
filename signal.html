<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BLACKDOG AVIATOR - Official Signal</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    :root {
      --primary-color: #00f0ff;
      --secondary-color: #0855c4;
      --accent-color: #ff0000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: black;
      color: white;
      font-family: 'Orbitron', monospace;
    }
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* সেটিংস বাটন */
    .settings-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      font-size: 20px;
      color: var(--primary-color);
      cursor: pointer;
      z-index: 1001;
      background: rgba(0,0,0,0.65);
      padding: 10px;
      border-radius: 50%;
      border: 1px solid var(--primary-color);
      box-shadow: 0 0 10px var(--primary-color);
      transition: transform 0.3s;
    }
    .settings-btn:hover {
      transform: rotate(90deg) scale(1.1);
    }

    /* সেটিংস মোডাল */
    .settings-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0d0f15;
      border: 2px solid var(--primary-color);
      box-shadow: 0 0 30px var(--primary-color);
      padding: 20px;
      border-radius: 15px;
      z-index: 2000;
      width: 90%;
      max-width: 340px;
      max-height: 85vh;
      overflow-y: auto;
      text-align: center;
    }
    .settings-modal::-webkit-scrollbar { width: 4px; }
    .settings-modal::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 4px; }

    .settings-modal h3 {
      color: var(--primary-color);
      margin: 12px 0 8px;
      font-size: 13px;
      letter-spacing: 1px;
    }
    
    /* কালার গ্রিড */
    .theme-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .theme-btn {
      height: 30px;
      border-radius: 6px;
      border: 2px solid #fff;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s;
    }
    .theme-btn:active { transform: scale(0.9); }

    /* অ্যানিমেশন লিস্ট */
    .anim-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .anim-btn {
      background: #181b22;
      color: #fff;
      border: 1px solid var(--primary-color);
      padding: 7px 4px;
      border-radius: 6px;
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .anim-btn.active {
      background: var(--primary-color);
      color: #000;
      font-weight: 900;
    }

    /* টাইমার অপশনস */
    .timer-options {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 15px;
    }
    .timer-btn {
      flex: 1;
      background: #181b22;
      color: #fff;
      border: 1px solid #444;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      font-family: 'Orbitron', monospace;
      cursor: pointer;
    }
    .timer-btn.active {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .close-modal {
      background: #ff0055;
      color: white;
      border: none;
      padding: 8px 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
      width: 100%;
    }

    /* টপ ব্যানার */
    .top-banner {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', monospace;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--primary-color);
      background: rgba(0,0,0,0.65);
      padding: 9px 18px;
      border-radius: 12px;
      box-shadow: 0 0 10px var(--primary-color);
      text-shadow: 0 0 8px var(--primary-color);
      user-select: none;
      z-index: 1000;
      white-space: nowrap;
    }

    /* লোগো */
    .logo {
      display: block;
      margin: 75px auto 14px; 
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      filter: drop-shadow(0 0 12px var(--primary-color));
      user-select: none;
      pointer-events: none;
    }

    /* ইউআইডি কন্টেইনার */
    .uid-container {
      margin-bottom: 15px;
      text-align: center;
    }
    .uid-text {
      display: inline-block;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 2px;
      color: var(--primary-color);
      text-shadow: 0 0 15px var(--primary-color);
      user-select: none;
      cursor: pointer;
      border: 1px dashed var(--primary-color);
      padding: 5px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.4);
      transition: transform 0.2s;
    }
    .uid-text:active { transform: scale(0.96); }
    .uid-hint {
      display: block;
      font-size: 9px;
      color: #8893a2;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    /* ================= 7 টি আলাদা স্টাইলিশ ঘুরন্ত রিং ================= */
    .signal-circle-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
      position: relative;
    }
    .orbit-stage {
      position: relative;
      width: 252px;
      height: 252px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* সাধারণ রিং প্রপার্টি */
    .orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      pointer-events: none;
      transform-origin: center center;
    }

    /* ১. লাল রিং (ড্যাশড স্টাইল - ক্লকওয়াইজ ঘূর্ণন) */
    .ring-red {
      width: 178px;
      height: 178px;
      border: 2px dashed #ff0055;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
      animation: spinRight 3.5s linear infinite;
    }

    /* ২. কমলা রিং (ডটেড স্টাইল - অ্যান্টি-ক্লকওয়াইজ ঘূর্ণন) */
    .ring-orange {
      width: 188px;
      height: 188px;
      border: 2.5px dotted #ff7700;
      box-shadow: 0 0 8px rgba(255, 119, 0, 0.6);
      animation: spinLeft 5s linear infinite;
    }

    /* ৩. হলুদ রিং (আর্ক ও ডাবল গ্যাপ স্টাইল) */
    .ring-yellow {
      width: 198px;
      height: 198px;
      border: 2px solid transparent;
      border-top: 2.5px solid #ffee00;
      border-bottom: 2.5px solid #ffee00;
      border-left: 2px dashed #ffee00;
      box-shadow: 0 0 9px rgba(255, 238, 0, 0.6);
      animation: spinRight 7s linear infinite;
    }

    /* ৪. নিওন গ্রিন রিং (লং ড্যাশড স্টাইল) */
    .ring-green {
      width: 208px;
      height: 208px;
      border: 2px dashed #00ff66;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
      animation: spinLeft 4.5s linear infinite;
    }

    /* ৫. সায়ান ব্লু রিং (সাইড ব্র্যাকেট আর্ক স্টাইল) */
    .ring-cyan {
      width: 218px;
      height: 218px;
      border: 2.5px solid transparent;
      border-left: 3px solid #00f0ff;
      border-right: 3px solid #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
      animation: spinRight 6s linear infinite;
    }

    /* ৬. পার্পল রিং (ফাইন ডট স্টাইল) */
    .ring-purple {
      width: 228px;
      height: 228px;
      border: 2px dotted #aa00ff;
      box-shadow: 0 0 10px rgba(170, 0, 255, 0.6);
      animation: spinLeft 8s linear infinite;
    }

    /* ৭. পিঙ্ক / ম্যাজেন্টা রিং (আউটার ড্যাশড স্টাইল) */
    .ring-pink {
      width: 240px;
      height: 240px;
      border: 2px dashed #ff00bb;
      box-shadow: 0 0 12px rgba(255, 0, 187, 0.7);
      animation: spinRight 9s linear infinite;
    }

    /* ঘূর্ণন অ্যানিমেশন */
    @keyframes spinRight {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes spinLeft {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    /* মাঝের কালো সিগন্যাল বৃত্ত */
    .signal-circle {
      position: relative;
      width: 166px;
      height: 166px;
      border-radius: 50%;
      background: #000000; /* ভিতরের অংশ পুরো কালো */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.2s ease;
      box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.1);
    }
    .signal-circle:hover {
      transform: scale(1.04);
    }

    /* ওয়েটিং টেক্সট */
    .waiting {
      text-align: center;
      margin-top: 15px;
      color: var(--primary-color);
      min-height: 20px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* স্টার্ট সিগন্যাল বাটন (নিচে পজিশন করা) */
    .btn {
      display: block;
      width: 320px;
      max-width: 90%;
      margin: 35px auto 15px; /* পর্যাপ্ত নিচে নামানো */
      padding: 13px;
      background: linear-gradient(93.73deg, var(--primary-color), var(--secondary-color));
      color: white;
      font-size: 20px;
      font-weight: bold;
      font-family: 'Orbitron', monospace;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      outline: none;
      box-shadow: 0 0 15px var(--primary-color);
    }
    .btn:hover:not(:disabled) { filter: saturate(1.4); }
    .btn:active:not(:disabled) { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* প্রগ্রেস বার */
    .progress-container {
      width: 320px;
      max-width: calc(100% - 30px);
      height: 18px;
      margin: 12px auto;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--primary-color);
    }
    .progress-bar {
      height: 100%;
      background: var(--primary-color);
      width: 0%;
      transition: width 1s linear;
    }
    .progress-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <!-- সেটিংস আইকন -->
  <div class="settings-btn" onclick="toggleSettings()"><i class="fas fa-gear"></i></div>

  <!-- সেটিংস মোডাল -->
  <div class="settings-modal" id="settingsModal">
    <h3>COLOR PALETTES (8)</h3>
    <div class="theme-options">
      <button class="theme-btn" title="Cyan" style="background:#00f0ff" onclick="setTheme('#00f0ff', '#0855c4', '#ff0000')"></button>
      <button class="theme-btn" title="Crimson" style="background:#ff0055" onclick="setTheme('#ff0055', '#990033', '#00f0ff')"></button>
      <button class="theme-btn" title="Neon Green" style="background:#00ff66" onclick="setTheme('#00ff66', '#008833', '#ff0055')"></button>
      <button class="theme-btn" title="Gold Amber" style="background:#ffbb00" onclick="setTheme('#ffbb00', '#bb8800', '#ff0000')"></button>
      <button class="theme-btn" title="Deep Purple" style="background:#9900ff" onclick="setTheme('#9900ff', '#5500aa', '#00ffcc')"></button>
      <button class="theme-btn" title="Electric Violet" style="background:#e000ff" onclick="setTheme('#e000ff', '#7000aa', '#00ffaa')"></button>
      <button class="theme-btn" title="Acid Lime" style="background:#a6ff00" onclick="setTheme('#a6ff00', '#558800', '#ff0066')"></button>
      <button class="theme-btn" title="Ice White" style="background:#ffffff" onclick="setTheme('#ffffff', '#555555', '#ff0000')"></button>
    </div>

    <h3>ANIMATION THEMES (6)</h3>
    <div class="anim-options">
      <button class="anim-btn active" id="btn-network" onclick="setAnimation('network')">NETWORK</button>
      <button class="anim-btn" id="btn-matrix" onclick="setAnimation('matrix')">MATRIX RAIN</button>
      <button class="anim-btn" id="btn-stars" onclick="setAnimation('stars')">WARP STARS</button>
      <button class="anim-btn" id="btn-hex" onclick="setAnimation('hex')">HEXAGONS</button>
      <button class="anim-btn" id="btn-cubes" onclick="setAnimation('cubes')">3D CUBES</button>
      <button class="anim-btn" id="btn-wave" onclick="setAnimation('wave')">WAVE GRID</button>
    </div>

    <h3>SIGNAL INTERVAL</h3>
    <div class="timer-options">
      <button class="timer-btn" id="t-30" onclick="setIntervalTime(30)">30s</button>
      <button class="timer-btn active" id="t-60" onclick="setIntervalTime(60)">60s</button>
      <button class="timer-btn" id="t-90" onclick="setIntervalTime(90)">90s</button>
    </div>

    <button class="close-modal" onclick="toggleSettings()">CLOSE</button>
  </div>

  <!-- টপ ব্যানার -->
  <div class="top-banner">BLACKDOG AVIATOR</div>

  <!-- লোগো -->
  <img class="logo" src="https://i.ibb.co/DH4H96PT/file-00000000bbb0821183581be58d569597.png" alt="Logo" />

  <!-- ইউআইডি কন্টেইনার -->
  <div class="uid-container">
    <div class="uid-text" id="uidDisplay" title="Double click to set UID">SET UID</div>
    <span class="uid-hint">Double click to set 9-digit UID</span>
  </div>

  <!-- সিগন্যাল সার্কেল (একসাথে ৭টি আলাদা স্টাইলের ঘূর্ণায়মান রঙিন লাইন) -->
  <div class="signal-circle-container">
    <div class="orbit-stage">
      <!-- ১. লাল (ড্যাশড) -->
      <div class="orbit-ring ring-red"></div>
      <!-- ২. কমলা (ডটেড) -->
      <div class="orbit-ring ring-orange"></div>
      <!-- ৩. হলুদ (ডুয়েল আর্চ) -->
      <div class="orbit-ring ring-yellow"></div>
      <!-- ৪. নিওন গ্রিন (লং ড্যাশড) -->
      <div class="orbit-ring ring-green"></div>
      <!-- ৫. সায়ান ব্লু (ব্র্যাকেট) -->
      <div class="orbit-ring ring-cyan"></div>
      <!-- ৬. পার্পল (ফাইন ডট) -->
      <div class="orbit-ring ring-purple"></div>
      <!-- ৭. পিঙ্ক/ম্যাজেন্টা (আউটার ড্যাশ) -->
      <div class="orbit-ring ring-pink"></div>

      <!-- মাঝের কালো সিগন্যাল ডিসপ্লে -->
      <div class="signal-circle" id="signalDisplay">SIGNAL</div>
    </div>
  </div>

  <div class="waiting" id="waitingText"></div>

  <!-- স্টার্ট সিগন্যাল বাটন -->
  <button class="btn" id="signalBtn">Start Signal</button>

  <div class="progress-container" id="progressContainer" style="display:none;">
    <div class="progress-bar" id="progressBar"></div>
    <div class="progress-text" id="progressText">Auto Updating in 60s</div>
  </div>

  <script>
    // ====== UID SYSTEM ======
    const uidDisplay = document.getElementById('uidDisplay');
    const savedUID = localStorage.getItem('saved_user_uid');
    if (savedUID) {
      uidDisplay.textContent = `UID: ${savedUID}`;
    }

    uidDisplay.addEventListener('dblclick', () => {
      let currentVal = localStorage.getItem('saved_user_uid') || '';
      let input = prompt("Enter your 9-digit Game UID:", currentVal);
      if (input !== null) {
        input = input.trim();
        if (/^\d{9}$/.test(input)) {
          localStorage.setItem('saved_user_uid', input);
          uidDisplay.textContent = `UID: ${input}`;
        } else {
          alert("Invalid UID! Please enter exactly 9 digits (numbers only).");
        }
      }
    });

    // ====== MODAL & THEMES ======
    function toggleSettings() {
      const modal = document.getElementById('settingsModal');
      modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
    }

    let currentParticleColor = '#ff0000';
    let currentPrimaryColor = '#00f0ff';

    function setTheme(p, s, a) {
      document.documentElement.style.setProperty('--primary-color', p);
      document.documentElement.style.setProperty('--secondary-color', s);
      document.documentElement.style.setProperty('--accent-color', a);
      currentParticleColor = a;
      currentPrimaryColor = p;

      localStorage.setItem('theme_p', p);
      localStorage.setItem('theme_s', s);
      localStorage.setItem('theme_a', a);
    }

    if(localStorage.getItem('theme_p')) {
      setTheme(localStorage.getItem('theme_p'), localStorage.getItem('theme_s'), localStorage.getItem('theme_a'));
    }

    // ====== DYNAMIC ANIMATION ENGINE ======
    let currentAnimation = localStorage.getItem('anim_theme') || 'network';
    let maxInterval = parseInt(localStorage.getItem('signal_timer') || '60');

    function setIntervalTime(sec) {
      maxInterval = sec;
      localStorage.setItem('signal_timer', sec);
      document.querySelectorAll('.timer-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`t-${sec}`).classList.add('active');
    }

    function setAnimation(animName) {
      currentAnimation = animName;
      localStorage.setItem('anim_theme', animName);
      
      document.querySelectorAll('.anim-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${animName}`);
      if(activeBtn) activeBtn.classList.add('active');

      initAnimationTheme();
    }

    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initAnimationTheme();
    }
    window.addEventListener('resize', resizeCanvas);

    let particles = [];
    let matrixColumns = [];
    const matrixChars = "0123456789ABCDEF$#@%*+-";
    let stars = [];
    let hexagons = [];
    let cubes = [];
    let waveOffset = 0;

    function initAnimationTheme() {
      if (currentAnimation === 'network') {
        particles = [];
        for (let i = 0; i < 50; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            speedX: (Math.random() - 0.5) * 0.7,
            speedY: (Math.random() - 0.5) * 0.7
          });
        }
      } else if (currentAnimation === 'matrix') {
        const cols = Math.floor(canvas.width / 18);
        matrixColumns = [];
        for (let i = 0; i < cols; i++) matrixColumns[i] = Math.random() * -100;
      } else if (currentAnimation === 'stars') {
        stars = [];
        for (let i = 0; i < 110; i++) {
          stars.push({
            x: (Math.random() - 0.5) * canvas.width,
            y: (Math.random() - 0.5) * canvas.height,
            z: Math.random() * canvas.width
          });
        }
      } else if (currentAnimation === 'hex') {
        hexagons = [];
        for (let i = 0; i < 22; i++) {
          hexagons.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 22 + 12,
            speedY: (Math.random() * 0.4) + 0.2,
            opacity: Math.random() * 0.4 + 0.1
          });
        }
      } else if (currentAnimation === 'cubes') {
        cubes = [];
        for (let i = 0; i < 18; i++) {
          cubes.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 20 + 10,
            rot: Math.random() * Math.PI,
            rotSpeed: (Math.random() - 0.5) * 0.02,
            speedY: Math.random() * 0.5 + 0.3
          });
        }
      }
    }

    function drawHexagon(x, y, r) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        ctx.lineTo(x + r * Math.cos(i * 2 * Math.PI / 6), y + r * Math.sin(i * 2 * Math.PI / 6));
      }
      ctx.closePath();
      ctx.stroke();
    }

    function renderEngine() {
      if (currentAnimation === 'network') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < particles.length; i++) {
          let p = particles[i];
          p.x += p.speedX; p.y += p.speedY;
          if (p.x > canvas.width || p.x < 0) p.speedX *= -1;
          if (p.y > canvas.height || p.y < 0) p.speedY *= -1;

          ctx.fillStyle = currentParticleColor;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            let p2 = particles[j];
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 130) {
              ctx.strokeStyle = `rgba(255, 255, 255, ${(130 - dist) / 130 * 0.25})`;
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }
      } else if (currentAnimation === 'matrix') {
        ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = currentPrimaryColor;
        ctx.font = "14px monospace";

        for (let i = 0; i < matrixColumns.length; i++) {
          const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
          ctx.fillText(text, i * 18, matrixColumns[i]);
          if (matrixColumns[i] > canvas.height && Math.random() > 0.975) matrixColumns[i] = 0;
          matrixColumns[i] += 16;
        }
      } else if (currentAnimation === 'stars') {
        ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        for (let s of stars) {
          s.z -= 4;
          if (s.z <= 0) {
            s.z = canvas.width;
            s.x = (Math.random() - 0.5) * canvas.width;
            s.y = (Math.random() - 0.5) * canvas.height;
          }
          let k = 128.0 / s.z;
          let px = s.x * k + cx;
          let py = s.y * k + cy;

          if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
            let size = (1 - s.z / canvas.width) * 3;
            ctx.fillStyle = currentPrimaryColor;
            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else if (currentAnimation === 'hex') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let hex of hexagons) {
          hex.y -= hex.speedY;
          if (hex.y < -30) {
            hex.y = canvas.height + 30;
            hex.x = Math.random() * canvas.width;
          }
          ctx.strokeStyle = currentPrimaryColor;
          ctx.globalAlpha = hex.opacity;
          ctx.lineWidth = 1.5;
          drawHexagon(hex.x, hex.y, hex.size);
          ctx.globalAlpha = 1.0;
        }
      } else if (currentAnimation === 'cubes') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let c of cubes) {
          c.y -= c.speedY;
          c.rot += c.rotSpeed;
          if (c.y < -40) {
            c.y = canvas.height + 40;
            c.x = Math.random() * canvas.width;
          }
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.strokeStyle = currentPrimaryColor;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-c.size / 2, -c.size / 2, c.size, c.size);
          ctx.restore();
        }
      } else if (currentAnimation === 'wave') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        waveOffset += 0.03;

        ctx.strokeStyle = currentPrimaryColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += 30) {
          let y = canvas.height / 2 + Math.sin(x * 0.015 + waveOffset) * 60;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      requestAnimationFrame(renderEngine);
    }

    resizeCanvas();
    setAnimation(currentAnimation);
    setIntervalTime(maxInterval);
    renderEngine();

    // ====== FIREBASE SETUP ======
    const firebaseConfig = {
      apiKey: "AIzaSyCV8gnfgtQjA-IBrfV4aJdz2agbhXnML2I",
      authDomain: "sunnyfuther.firebaseapp.com",
      databaseURL: "https://sunnyfuther-default-rtdb.firebaseio.com",
      projectId: "sunnyfuther",
      storageBucket: "sunnyfuther.firebasestorage.app",
      messagingSenderId: "1058855642796",
      appId: "1:1058855642796:web:6ffff989a42905f8b7e109"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ====== ডাইনামিক বৈচিত্র্যময় র্যান্ডম সিগন্যাল লজিক ======
    const signalDisplay = document.getElementById('signalDisplay');
    const signalBtn = document.getElementById('signalBtn');
    const waitingText = document.getElementById('waitingText');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    let loopStarted = false;
    let timeRemains = maxInterval;
    let timer = null;
    let lastRangeIndex = -1;

    const waitingMessages = [
      "Connecting to Game Hash...",
      "Analyzing Round Sequence...",
      "Extracting UID Data...",
      "Syncing with Aviator Game...",
      "Signal Ready..."
    ];

    // প্রতি ক্লিকে ভিন্ন ধাঁচের পয়েন্ট আসার জন্য ৪টি রেঞ্জের রোটেশন
    function getRandomSignal() {
      // 0: Low (1.18x - 1.95x)
      // 1: Medium (2.10x - 4.80x)
      // 2: High (5.20x - 12.50x)
      // 3: Mega (14.00x - 38.00x)
      const ranges = [0, 1, 2, 3];
      const availableRanges = ranges.filter(idx => idx !== lastRangeIndex);
      const chosenRange = availableRanges[Math.floor(Math.random() * availableRanges.length)];
      lastRangeIndex = chosenRange;

      let val = 1.00;
      if (chosenRange === 0) {
        val = Math.random() * (1.95 - 1.18) + 1.18;
      } else if (chosenRange === 1) {
        val = Math.random() * (4.80 - 2.10) + 2.10;
      } else if (chosenRange === 2) {
        val = Math.random() * (12.50 - 5.20) + 5.20;
      } else {
        val = Math.random() * (38.00 - 14.00) + 14.00;
      }
      return parseFloat(val.toFixed(2));
    }

    async function generateSignal() {
      signalBtn.disabled = true;
      signalDisplay.textContent = "WAIT...";
      
      let msgInterval = setInterval(() => {
          waitingText.textContent = waitingMessages[Math.floor(Math.random() * waitingMessages.length)];
      }, 300);

      await new Promise(r => setTimeout(r, 2000));
      clearInterval(msgInterval);

      const signal = getRandomSignal();
      const finalVal = signal.toFixed(2);
      
      // Firebase-এ ক্র্যাশ পয়েন্ট আপডেট
      db.ref('crashPoint').set(parseFloat(finalVal))
        .then(() => {
           waitingText.textContent = "SIGNAL ACTIVE IN GAME ✅";
           waitingText.style.color = "#00ff00";
        })
        .catch((err) => {
           waitingText.textContent = "SERVER ERROR ❌";
           waitingText.style.color = "red";
        });

      signalDisplay.textContent = `${finalVal}x`;
      signalBtn.disabled = false;

      if (!loopStarted) {
        loopStarted = true;
        signalBtn.textContent = "NEXT SIGNAL";
        progressContainer.style.display = "block";
        startCountdown();
      }
    }

    function startCountdown() {
      timeRemains = maxInterval;
      updateProgress();

      clearInterval(timer);
      timer = setInterval(() => {
        timeRemains--;
        updateProgress();
        if (timeRemains <= 0) {
          clearInterval(timer);
          generateSignal();
        }
      }, 1000);
    }

    function updateProgress() {
      const percent = 100 - (timeRemains / maxInterval * 100);
      progressBar.style.width = `${percent}%`;
      progressText.textContent = `Auto Updating in ${timeRemains}s`;
    }

    signalBtn.addEventListener('click', () => {
      if (loopStarted) {
        clearInterval(timer);
        generateSignal();
        startCountdown();
      } else {
        generateSignal();
      }
    });
  </script>
