    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #1B1C1E; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 60px; }

        /* HEADER */
        header { height: 50px; background: #1B1C1E; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 1px solid #333; z-index: 100; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .site-logo { height: 26px; width: auto; } 
        .nav-links { display: flex; gap: 15px; font-size: 13px; color: #8893a2; font-weight: 500; }
        .nav-links span.active { color: #fff; border-bottom: 2px solid #e91e63; padding-bottom: 14px; margin-bottom: -15px; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .hdr-img-right { height: 32px; width: auto; }

        /* SUB-HEADER */
        .sub-header-strip {
            width: 100%; height: 45px; background: #1B1C1E; 
            border-bottom: 1px solid #333; 
            flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
            padding-right: 10px;
        }
        .sub-left-img { height: 80%; width: auto; margin-left: 10px; object-fit: contain; opacity: 0.9; }
        .sub-right-container { display: flex; align-items: center; gap: 8px; height: 100%; }
        .balance-display { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; line-height: 1.1; }
        .currency-label { font-size: 9px; color: #ccc; font-weight: bold; }
        .amount-value { font-size: 13px; color: #fff; font-weight: 900; }
        .deposit-btn { background: #28a909; border: none; color: white; padding: 5px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .right-promo-img { height: 100%; width: auto; mask-image: linear-gradient(to left, black 80%, transparent 100%); }

        /* LAYOUT */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; height: 100%; width: 100%; }

        /* Left Sidebar & Bets List Background */
        .col-images { width: 220px; background: #1B1C1E; border-right: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex-shrink: 0; }
        .promo-img { width: 100%; border-radius: 10px; border: 1px solid #333; transition: transform 0.2s; }

        .col-bets { width: 280px; background: #1B1C1E; border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-tabs { display: flex; background: #000; padding: 4px; margin: 8px; border-radius: 20px; }
        .sb-tab { flex: 1; text-align: center; padding: 6px; font-size: 11px; color: #6d7989; cursor: pointer; border-radius: 15px; font-weight: bold; }
        .sb-tab.active { background: #333; color: #fff; }
        .bets-info { padding: 0 10px 8px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .bet-count { font-size: 11px; color: #fff; font-weight: bold; }
        .green-dot { width: 6px; height: 6px; background: #28a909; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .list-head { display: flex; padding: 6px 10px; font-size: 10px; color: #6d788b; background: #1B1C1E; }
        .col-u { width: 30%; } .col-b { width: 25%; text-align: right; } .col-m { width: 20%; text-align: right; } .col-w { width: 25%; text-align: right; }
        .bets-list { flex: 1; overflow-y: auto; overflow-x: hidden; background: #1B1C1E; }
        .bet-row { display: flex; padding: 4px 10px; font-size: 11px; align-items: center; border-bottom: 1px solid #333; height: 30px; }
        .bet-row.green-row { background: rgba(24, 165, 49, 0.1); border-left: 2px solid #18a531; } 
        .u-pic { width: 18px; height: 18px; border-radius: 50%; margin-right: 5px; vertical-align: middle; border: none; }
        .t-bet { color: #fff; font-weight: 500; }
        .t-mult { color: #3b99fc; font-weight: bold; }
        .t-win { color: #fff; font-weight: bold; }

        /* GAME AREA */
        .col-game { flex: 1; display: flex; flex-direction: column; background: #1B1C1E; padding: 5px; position: relative; overflow: hidden; }
        
        .aviator-bar { height: 30px; background: #1B1C1E; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; margin-bottom: 5px; border-radius: 5px; flex-shrink: 0; }
        .av-logo-txt { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; color: #d32f2f; font-style: italic; }
        .av-right { display: flex; align-items: center; gap: 10px; color: #8893a2; font-size: 12px; }
        .av-balance { color: #fff; font-weight: bold; font-size: 12px; background: #000; padding: 3px 10px; border-radius: 12px; border: 1px solid #333; }

        .history-wrapper { height: 30px; display: flex; gap: 5px; margin-bottom: 5px; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .history-pills-box { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; height: 100%; align-items: center; flex: 1; }
        .history-pills-box::-webkit-scrollbar { display: none; }
        .pill { padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; min-width: 45px; text-align: center; border: none; }
        .p-green { color: #fff; background: #28a909; } .p-purple { color: #fff; background: #913ef8; } .p-blue { color: #fff; background: #34b4ff; }
        .history-icon-btn { width: 30px; height: 20px; background: #222; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #8893a2; margin-left: 5px; }

        /* STAGE */
        .stage { flex: 1; position: relative; border-radius: 10px; overflow: hidden; background: radial-gradient(circle at center, #380e13 0%, #000 80%); margin-bottom: 5px; border: 1px solid #333; min-height: 200px; }
        
        .stage-bottom-info { position: absolute; bottom: 10px; right: 10px; z-index: 15; display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 20px; border: 1px solid #333; }
        .face-group { display: flex; }
        .face-mini { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #28a909; margin-left: -8px; object-fit: cover; }
        .live-count { font-size: 11px; font-weight: bold; color: #fff; margin-left: 5px; }

        .win-dialog-container {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            display: none; align-items: center;
            background: rgba(18, 52, 5, 0.95); 
            border: 1px solid #427f00;
            border-radius: 50px;
            padding: 5px 15px;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            min-width: 280px;
            justify-content: space-between;
        }
        .wd-left { display: flex; flex-direction: column; padding-right: 15px; }
        .wd-msg { color: #9ea0a3; font-size: 10px; margin-bottom: 2px; }
        .wd-mult { color: #fff; font-size: 18px; font-weight: 500; }
        .wd-right { background: #4eaf11; border-radius: 30px; padding: 5px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 100px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .wd-win-lbl { color: #fff; font-size: 10px; font-weight: bold; text-shadow: 0 1px 1px rgba(0,0,0,0.2); }
        .wd-amount { color: #fff; font-size: 18px; font-weight: 900; text-shadow: 0 1px 1px rgba(0,0,0,0.2); }
        .wd-close { color: #d2d2d2; font-size: 16px; margin-left: 10px; cursor: pointer; opacity: 0.7; font-weight: bold; }

        .bg-rays { position: absolute; left: 0; bottom: 0; width: 250vmax; height: 250vmax; transform: translate(-50%, 50%); background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.03) 0deg 5deg, transparent 5deg 10deg); animation: spin 60s linear infinite; z-index: 0; pointer-events: none; }
        @keyframes spin { 100% { transform: translate(-50%, 50%) rotate(360deg); } }
        canvas { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 2; }
        
        .plane-obj { position: absolute; width: 80px; height: auto; z-index: 10; left: 20px; bottom: 20px; transition: transform 0.1s linear; }
        .hovering { animation: hover-plane 2s ease-in-out infinite; }
        @keyframes hover-plane { 0%, 100% { transform: translate(0px, 0px); } 50% { transform: translate(0px, -15px); } }

        .big-mult { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); font-size: 60px; font-weight: 900; color: white; z-index: 15; text-shadow: 0 0 30px rgba(0,0,0,0.8); display: none; }
        .crash-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; z-index: 20; }
        .flew-txt { font-size: 20px; color: #e91e63; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .crash-val { font-size: 40px; color: #d32f2f; font-weight: 900; }

        /* LOADING OVERLAY - FIX: Right to Left */
        .branding-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; background: rgba(0,0,0,0.7); z-index: 30; transition: opacity 0.3s; padding: 20px 0; }
        .logo-top { width: 120px; height: auto; }
        .loading-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        
        .loader-bar-container { 
            width: 120px; height: 4px; background: #444; border-radius: 2px; 
            overflow: hidden; position: relative; 
        }
        /* লাল দাগ ডাইন থেকে বামে আসবে */
        .loader-fill { 
            position: absolute; top: 0; right: 0; /* Right side fixed */
            width: 0%; height: 100%; 
            background: #d32f2f; 
            border-radius: 2px; 
        }
        
        .wait-txt { font-size: 14px; font-weight: bold; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .logo-bottom { width: 80px; height: auto; opacity: 0.8; }

        /* CONTROLS AREA COLOR FIX -> #1B1C1E */
        .controls { height: 110px; display: flex; gap: 8px; flex-shrink: 0; background: #1B1C1E; padding: 5px; }
        .bet-panel { flex: 1; background: #1B1C1E; border: 1px solid #333; border-radius: 10px; padding: 6px; display: flex; gap: 5px; }
        .panel-l { width: 55%; display: flex; flex-direction: column; justify-content: space-between; }
        .tabs-sm { display: flex; background: #000; border-radius: 15px; width: 80px; margin: 0 auto; padding: 2px; }
        .tab-sm { flex: 1; text-align: center; font-size: 9px; color: #888; cursor: pointer; border-radius: 12px; padding: 2px; font-weight: bold; }
        .tab-sm.active { background: #333; color: #fff; }
        .inp-row { display: flex; align-items: center; background: #000; border: 1px solid #333; border-radius: 6px; height: 28px; padding: 0 5px; }
        .pm-btn { width: 20px; height: 100%; background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 14px; }
        .inp-val { flex: 1; background: transparent; border: none; color: white; text-align: center; font-weight: bold; font-size: 13px; outline: none; }
        .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
        .pre-btn { background: #2c3442; border: none; color: #ccc; border-radius: 4px; font-size: 9px; padding: 4px 0; cursor: pointer; font-weight: bold; }
        .panel-r { flex: 1; }
        
        /* Buttons Style */
        .act-btn { width: 100%; height: 100%; border-radius: 8px; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; top: 0; }
        .act-btn:active { top: 3px; }
        
        /* COLOR LOGIC */
        .btn-green { background: #28a909; box-shadow: 0 3px 0 #1c7430; color: white; }
        .btn-red { background: #d32f2f; box-shadow: 0 3px 0 #8b0000; color: white; } /* Cancel */
        .btn-yellow { background: #ffc107; box-shadow: 0 3px 0 #c49000; color: black; } /* Cashout */

        .btn-lg-txt { font-size: 14px; font-weight: 800; text-transform: uppercase; }
        .btn-sm-txt { font-size: 10px; margin-top: 1px; }

        @media screen and (max-width: 900px) {
            header, .sub-header-strip { display: none !important; }
            .col-images { display: none !important; }
            body { overflow-y: auto; height: 100%; }
            .main-wrapper { display: flex; flex-direction: column; height: auto; width: 100%; }
            .col-game { width: 100%; height: auto; min-height: 400px; padding: 5px; order: 1; flex-shrink: 0; }
            .controls { flex-direction: column; height: auto; margin-top: 10px; }
            .bet-panel { width: 100%; height: 90px; }
            .col-bets { width: 100%; height: 500px; border-right: none; border-top: 2px solid #242526; order: 2; flex-shrink: 0; }
        }

        /* NEW BOTTOM BAR (Added as per request) */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background: #1B1C1E; border-top: 1px solid #333; z-index: 200;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        
        .back-btn { font-size: 14px; color: #fff; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .back-btn i { font-size: 12px; }
        
        .footer-bal { font-size: 16px; color: #fff; font-weight: bold; text-align: center; }
        
        .deposit-sm-btn { 
            background: #28a909; color: white; padding: 8px 20px; 
            border-radius: 5px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; 
        }
    </style>
</head>

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let balance = 0.00, currency = "USD", adminSig = 0, audioCtx = false;
        let bets = [{ val: 10, state: 'idle' }, { val: 20, state: 'idle' }];
        let currentUserID = null;

        // সরাসরি game_balance এ লিসেন করা হবে
        db.ref('game_balance').on('value', s => { 
            balance = parseFloat(s.val()) || 0; 
            updateUI(0); updateUI(1); 
        });

        db.ref('currency').on('value', s => { currency = s.val() || "USD"; updatePresets(); updateUI(0); updateUI(1); });
        db.ref('crashPoint').on('value', s => { adminSig = parseFloat(s.val()) || 0; });

        // --- Permanent History Setup ---
        db.ref('game_history').limitToLast(15).on('value', (snapshot) => {
            const hb = document.getElementById('historyBar');
            hb.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                // Reverse to show latest first
                Object.values(data).reverse().forEach(v => {
                    let val = parseFloat(v);
                    let c = 'p-blue';
                    if(val >= 10) c = 'p-green';
                    else if(val >= 2) c = 'p-purple';
                    let div = document.createElement('div');
                    div.className = 'pill ' + c;
                    div.innerText = val.toFixed(2) + 'x';
                    hb.appendChild(div);
                });
            }
        });

        function updatePresets() {
            let small = ['USD', 'EUR', 'USDT'];
            let vals = small.includes(currency) ? [1, 2, 5, 10] : [10, 20, 50, 100];
            if(small.includes(currency)) {
               if(bets[0].val > 50) bets[0].val = 1;
               if(bets[1].val > 50) bets[1].val = 2;
            } else {
               if(bets[0].val < 10) bets[0].val = 10;
               if(bets[1].val < 10) bets[1].val = 20;
            }
            for(let i=0; i<2; i++) {
                let h = ''; 
                vals.forEach(v => h += `<button class="pre-btn" onclick="addPreset(${i}, ${v})">${v}</button>`);
                document.getElementById(`presets${i}`).innerHTML = h;
            }
        }
        function addPreset(id, amount) { if(bets[id].state !== 'idle') return; bets[id].val += amount; updateUI(id); }
        function enableAudio() { if(!audioCtx) { audioCtx = true; const s = document.getElementById('s_fly'); s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(()=>{}); } }
        function playSound(type) { const s = document.getElementById('s_' + type); if(type === 'fly') s.volume = 0.4; s.currentTime = 0; s.play().catch(()=>{}); }
        function stopSound(type) { const s = document.getElementById('s_' + type); s.pause(); }

        const cvs = document.getElementById('gameCanvas');
        const ctx = cvs.getContext('2d');
        const stage = document.getElementById('stage');
        const planeEl = document.getElementById('planeObj');
        const planeURLs = [
            "https://aviator-demo.spribegaming.com/assets/images/canvas/plane/spribe/plane-0.svg",
            "https://aviator-demo.spribegaming.com/assets/images/canvas/plane/spribe/plane-1.svg",
            "https://aviator-demo.spribegaming.com/assets/images/canvas/plane/spribe/plane-2.svg"
        ];
        
        let width, height, multiplier = 1.00, isRunning = false, startTime = 0, crashPoint = 0, animId = null, frameInterval = null, frameIdx = 0;
        let currentPlaneX = 0, currentPlaneY = 0;
        function resize() { width = stage.offsetWidth; height = stage.offsetHeight; cvs.width = width; cvs.height = height; }
        window.addEventListener('resize', resize); resize();
        const faceUrls = [ "https://randomuser.me/api/portraits/men/32.jpg", "https://randomuser.me/api/portraits/women/44.jpg", "https://randomuser.me/api/portraits/men/85.jpg" ];
        function initFaces() { let h = ''; faceUrls.forEach(u => h += `<img src="${u}" class="face-mini">`); document.getElementById('faces').innerHTML = h; document.getElementById('liveUsers').innerText = Math.floor(Math.random()*500+200); } initFaces();

        function startLoading() {
            document.getElementById('crashView').style.display = 'none'; document.getElementById('multNum').style.display = 'none'; document.getElementById('winDialog').style.display = 'none'; ctx.clearRect(0,0,width,height);
            document.getElementById('loaderOverlay').style.display = 'flex'; document.getElementById('loaderOverlay').style.opacity = 1;
            planeEl.style.transform = `translate(0px, 0px)`; planeEl.style.left = "0px"; planeEl.style.bottom = "0px"; planeEl.classList.add('hovering'); planeEl.src = planeURLs[0];
            bets.forEach((b,i) => { if(b.state === 'placed') b.state = 'active'; updateUI(i); });
            generateBots();
            
            let p = 0; 
            let t = setInterval(() => { 
                p += 1; 
                document.getElementById('loadBar').style.width = p + "%";
                if(p >= 100) { 
                    clearInterval(t); 
                    document.getElementById('loaderOverlay').style.opacity = 0; 
                    setTimeout(() => { document.getElementById('loaderOverlay').style.display = 'none'; planeEl.classList.remove('hovering'); takeOff(); }, 300); 
                } 
            }, 50); 
        }

        function takeOff() {
            bets.forEach((b,i) => { if(b.state === 'placed') { b.state = 'active'; updateUI(i); } });
            isRunning = true; multiplier = 1.00; startTime = Date.now();
            let userPlaying = (bets[0].state === 'active' || bets[1].state === 'active');
            if (userPlaying && adminSig > 1) { crashPoint = adminSig; } else { crashPoint = parseFloat((Math.random() * 8 + 1.1).toFixed(2)); }
            document.getElementById('multNum').style.display = 'block'; playSound('fly');
            if(frameInterval) clearInterval(frameInterval); frameInterval = setInterval(() => { frameIdx = (frameIdx + 1) % 3; planeEl.src = planeURLs[frameIdx]; }, 100);
            animId = requestAnimationFrame(loop);
        }

        function loop() {
            let now = Date.now(); let t = (now - startTime) / 1000; 
            // Better realistic multiplier curve
            multiplier = 1.00 + (Math.pow(t, 2) * 0.01) + (t * 0.05);

            if(multiplier >= crashPoint) { crash(); return; }
            document.getElementById('multNum').innerText = multiplier.toFixed(2) + 'x';
            updateBots(); bets.forEach((b,i) => { if(b.state === 'active') updateUI(i); });
            
            ctx.clearRect(0,0,width,height);
            // Realistic Parabolic curve
            let progress = Math.min(t / 11, 0.95); 
            let ease = Math.pow(progress, 1.4); 
            let startX = 0, startY = height, endX = width - 80, endY = 50;
            let curX = startX + (endX - startX) * progress; 
            let curY = startY - (startY - endY) * ease;
            
            ctx.beginPath(); ctx.moveTo(startX, startY); ctx.quadraticCurveTo(curX * 0.4, startY, curX, curY); 
            ctx.lineTo(curX, height); ctx.lineTo(startX, height); ctx.closePath();
            let grad = ctx.createLinearGradient(0, curY, 0, height); grad.addColorStop(0, "rgba(211, 47, 47, 0.5)"); grad.addColorStop(1, "rgba(211, 47, 47, 0.0)"); ctx.fillStyle = grad; ctx.fill();
            ctx.beginPath(); ctx.moveTo(startX, startY); ctx.quadraticCurveTo(curX * 0.4, startY, curX, curY); ctx.lineWidth = 5; ctx.strokeStyle = "#d32f2f"; ctx.stroke();
            
            let rot = (progress * 12); currentPlaneX = curX; currentPlaneY = curY - height;
            planeEl.style.transform = `translate(${curX}px, ${curY - height}px) rotate(${-rot}deg)`;
            animId = requestAnimationFrame(loop);
        }

        function crash() {
            isRunning = false; cancelAnimationFrame(animId); clearInterval(frameInterval);
            ctx.clearRect(0,0,width,height); stopSound('fly'); playSound('crash');
            document.getElementById('multNum').style.display = 'none'; document.getElementById('crashView').style.display = 'block';
            document.getElementById('crashVal').innerText = parseFloat(crashPoint).toFixed(2) + 'x';
            
            // --- Save to Firebase History ---
            db.ref('game_history').push(parseFloat(crashPoint).toFixed(2));

            let flyOffX = currentPlaneX + 250; let flyOffY = currentPlaneY - 250;
            planeEl.style.transition = "transform 0.5s ease-in, opacity 0.5s ease-in"; planeEl.style.transform = `translate(${flyOffX}px, ${flyOffY}px) rotate(-45deg)`; planeEl.style.opacity = 0;
            
            bets.forEach((b,i) => { if(b.state === 'active') { b.state = 'idle'; updateUI(i); } });
            setTimeout(() => { planeEl.style.transition = "none"; planeEl.style.opacity = 1; startLoading(); }, 3500);
        }

        function showWin(amount, mult) {
            let winBox = document.getElementById('winDialog'); document.getElementById('winAmtDisplay').innerText = amount.toFixed(2);
            document.getElementById('winLabel').innerText = "Win " + currency; document.getElementById('winMultDisplay').innerText = mult.toFixed(2) + "x";
            winBox.style.display = 'flex'; setTimeout(() => { winBox.style.display = 'none'; }, 3000);
        }
        function closeWin(){ document.getElementById('winDialog').style.display = 'none'; }
        const botNames = ["Ali77", "King", "Rana", "WinPro", "Lucky", "Dhaka", "User1", "Max"]; const bList = document.getElementById('betsList'); let botBets = [];
        function generateBots() {
            bList.innerHTML = ""; botBets = []; let count = Math.floor(Math.random()*15 + 8); document.getElementById('totalBets').innerText = Math.floor(Math.random()*200+300);
            for(let i=0; i<count; i++) {
                let name = botNames[Math.floor(Math.random()*botNames.length)]; let amt = Math.floor(Math.random()*500+10); if(currency === 'USD') amt = Math.floor(Math.random()*50+1); let target = Math.random()*4 + 1.1; let img = `https://randomuser.me/api/portraits/men/${Math.floor(Math.random()*50)}.jpg`;
                let row = document.createElement('div'); row.className = 'bet-row green-row'; row.innerHTML = `<div class="col-u"><img src="${img}" class="u-pic">${name}</div><div class="col-b t-bet">${amt}</div><div class="col-m t-mult">-</div><div class="col-w t-win">-</div>`; bList.appendChild(row); botBets.push({ el: row, amt: amt, target: target, cashed: false });
            }
        }
        function updateBots() { if(!isRunning) return; botBets.forEach(bot => { if(!bot.cashed && multiplier >= bot.target) { bot.cashed = true; bot.el.style.borderLeft = "2px solid #28a909"; bot.el.style.background = "rgba(40, 169, 9, 0.2)"; bot.el.querySelector('.t-mult').innerText = bot.target.toFixed(2)+'x'; bot.el.querySelector('.t-win').innerText = (bot.amt * bot.target).toFixed(2); } }); }

        function updateUI(id) {
            let txt = balance.toLocaleString('en-US', {minimumFractionDigits:2});
            if(document.getElementById('currLabel')) document.getElementById('currLabel').innerText = currency;
            if(document.getElementById('walletAmount')) document.getElementById('walletAmount').innerText = txt;
            document.getElementById('wallet3').innerText = txt + " " + currency;
            document.getElementById('footerBal').innerText = txt; 

            document.getElementById(`inp${id}`).value = bets[id].val.toFixed(2);
            document.getElementById(`sub${id}`).innerText = bets[id].val.toFixed(2) + " " + currency;
            let btn = document.getElementById(`btn${id}`); let lbl = document.getElementById(`lbl${id}`);
            
            btn.className = "act-btn"; 
            if(bets[id].state === 'placed') { 
                btn.classList.add('btn-red'); 
                lbl.innerText = 'WAITING'; 
            }
            else if(bets[id].state === 'active') { 
                btn.classList.add('btn-yellow'); 
                lbl.innerText = 'CASH OUT'; 
                document.getElementById(`sub${id}`).innerText = (bets[id].val * multiplier).toFixed(2) + " " + currency; 
            }
            else { 
                btn.classList.add('btn-green'); 
                lbl.innerText = 'BET'; 
            }
        }
        function adjBet(id, type) { if(bets[id].state !== 'idle') return; let step = (currency === 'USD' || currency === 'EUR' || currency === 'USDT') ? 1.00 : 10.00; if(type === 'plus') bets[id].val += step; else bets[id].val -= step; if(bets[id].val < 1) bets[id].val = 1; updateUI(id); }
        function setBet(id, v) { if(bets[id].state !== 'idle') { bets[id].val = v; updateUI(id); } }

        function action(id) {
            if(bets[id].state === 'idle') {
                if(balance < bets[id].val) { alert("Insufficient Balance!"); return; }
                if(isRunning) { 
                    bets[id].state = 'placed'; 
                } else { 
                    bets[id].state = 'placed'; 
                    let newBal = balance - bets[id].val; 
                    db.ref('game_balance').set(newBal.toString()); 
                }
            } else if(bets[id].state === 'placed') {
                bets[id].state = 'idle';
                if(!isRunning) { 
                    let newBal = balance + bets[id].val; 
                    db.ref('game_balance').set(newBal.toString()); 
                }
            } else if(bets[id].state === 'active') {
                let win = bets[id].val * multiplier;
                let newBal = balance + win;
                db.ref('game_balance').set(newBal.toString()); 
                showWin(win, multiplier);
                bets[id].state = 'idle';
            }
            updateUI(id);
        }

        updatePresets();
        startLoading();
    </script>
</body>
</html>
