<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1win Admin Panel - Game Manager</title>
    <link rel="icon" type="image/png" href="https://uploads.onecompiler.io/443fxwbzx/44kbmurbf/1Win_icon-removebg-preview.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0c1017; color: #fff; min-height: 100vh; padding: 20px; }
        
        .container { max-width: 1000px; margin: 0 auto; }
        
        .admin-header {
            display: flex; align-items: center; justify-content: space-between;
            background: #161f2e; padding: 18px 25px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08); margin-bottom: 25px;
        }
        .admin-header h2 { font-size: 20px; color: #ff4b2b; display: flex; align-items: center; gap: 10px; }

        .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media(max-width: 850px) { .layout-grid { grid-template-columns: 1fr; } }

        /* FORM STYLING */
        .card {
            background: #161f2e; border-radius: 16px; padding: 22px;
            border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 18px; color: #00c6ff; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; color: #8893a2; margin-bottom: 6px; font-weight: 600; }
        input, select, textarea {
            width: 100%; background: #0c1017; border: 1px solid #233044; border-radius: 10px;
            padding: 10px 14px; color: #fff; font-size: 13px; outline: none; transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: #00c6ff; }
        textarea { resize: vertical; min-height: 120px; font-family: monospace; font-size: 12px; }

        .type-toggle { display: flex; gap: 10px; margin-bottom: 15px; }
        .type-btn {
            flex: 1; padding: 9px; background: #0c1017; border: 1px solid #233044;
            border-radius: 8px; color: #8893a2; font-weight: 600; cursor: pointer; font-size: 12px; text-align: center;
        }
        .type-btn.active { background: #00c6ff; color: #000; border-color: #00c6ff; }

        .btn-submit {
            width: 100%; background: linear-gradient(90deg, #28a909, #1c7430);
            border: none; color: #fff; padding: 12px; border-radius: 10px;
            font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(40,169,9,0.3); transition: transform 0.1s;
        }
        .btn-submit:active { transform: scale(0.98); }

        /* GAME LIST STYLING */
        .games-list { display: flex; flex-direction: column; gap: 12px; max-height: 520px; overflow-y: auto; padding-right: 5px; }
        .game-item {
            background: #0c1017; border: 1px solid #233044; border-radius: 12px;
            padding: 12px 15px; display: flex; align-items: center; justify-content: space-between;
        }
        .game-item-info { display: flex; align-items: center; gap: 12px; }
        .game-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #161f2e; }
        .game-item-title { font-size: 14px; font-weight: 700; color: #fff; }
        .game-item-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(0,198,255,0.15); color: #00c6ff; font-weight: 700; }
        .btn-delete { background: #d32f2f; border: none; color: #fff; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
        .btn-delete:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <header class="admin-header">
            <h2><i class="fa-solid fa-gamepad"></i> Game Management Admin Panel</h2>
            <a href="index.html" target="_blank" style="color: #00c6ff; text-decoration: none; font-size: 13px; font-weight: 600;">
                <i class="fa-solid fa-external-link"></i> ইউজার হাব দেখুন
            </a>
        </header>

        <div class="layout-grid">
            <!-- Add Game Form -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-plus-circle"></i> নতুন গেম যুক্ত করুন</div>

                <div class="form-group">
                    <label>গেমের নাম (Game Title)</label>
                    <input type="text" id="gameTitle" placeholder="যেমন: Aviator Pro, Mines 3D..." required>
                </div>

                <div class="form-group">
                    <label>বিবরণ / সাবটাইটেল (Short Description)</label>
                    <input type="text" id="gameDesc" placeholder="যেমন: ক্র্যাশ করার আগেই ক্যাশআউট করুন!">
                </div>

                <div class="form-group">
                    <label>আইকন বা থাম্বনেইল ছবির লিংক (Thumbnail Image URL)</label>
                    <input type="url" id="gameThumb" placeholder="https://example.com/icon.png">
                </div>

                <label>আপলোডের ধরন নির্বাচন করুন (Upload Method)</label>
                <div class="type-toggle">
                    <div class="type-btn active" id="btnTypeHtml" onclick="setType('html')"><i class="fa-solid fa-code"></i> সরাসরি HTML কোড</div>
                    <div class="type-btn" id="btnTypeLink" onclick="setType('link')"><i class="fa-solid fa-link"></i> গেমের URL লিংক</div>
                </div>

                <!-- Field for HTML Code -->
                <div class="form-group" id="groupHtml">
                    <label>সম্পূর্ণ HTML কোড পেস্ট করুন</label>
                    <textarea id="gameCode" placeholder="<!DOCTYPE html><html>...</html>"></textarea>
                </div>

                <!-- Field for Game Link -->
                <div class="form-group" id="groupLink" style="display: none;">
                    <label>গেমের লাইভ লিংক (Web URL)</label>
                    <input type="url" id="gameLink" placeholder="https://game-provider.com/game">
                </div>

                <button class="btn-submit" onclick="saveGame()"><i class="fa-solid fa-cloud-arrow-up"></i> ডেটাবেজে সেভ করুন</button>
            </div>

            <!-- Games List Display -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-list-check"></i> চলমান গেমসমূহ (<span id="gameCount">0</span>)</div>
                <div class="games-list" id="gamesContainer">
                    <div style="color:#8893a2; text-align:center; padding:30px; font-size:13px;">লোড হচ্ছে...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCV8gnfgtQjA-IBrfV4aJdz2agbhXnML2I",
          authDomain: "sunnyfuther.firebaseapp.com",
          databaseURL: "https://sunnyfuther-default-rtdb.firebaseio.com",
          projectId: "sunnyfuther",
          storageBucket: "sunnyfuther.firebasestorage.app",
          messagingSenderId: "1058855642796",
          appId: "1:1058855642796:web:6ffff989a42905f8b7e109"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentType = 'html';

        function setType(type) {
            currentType = type;
            if(type === 'html') {
                document.getElementById('btnTypeHtml').classList.add('active');
                document.getElementById('btnTypeLink').classList.remove('active');
                document.getElementById('groupHtml').style.display = 'block';
                document.getElementById('groupLink').style.display = 'none';
            } else {
                document.getElementById('btnTypeLink').classList.add('active');
                document.getElementById('btnTypeHtml').classList.remove('active');
                document.getElementById('groupHtml').style.display = 'none';
                document.getElementById('groupLink').style.display = 'block';
            }
        }

        // Save Game to Firebase
        function saveGame() {
            const title = document.getElementById('gameTitle').value.trim();
            const desc = document.getElementById('gameDesc').value.trim();
            const thumb = document.getElementById('gameThumb').value.trim() || 'https://uploads.onecompiler.io/443fxwbzx/44kbmurbf/1Win_icon-removebg-preview.png';
            const code = document.getElementById('gameCode').value;
            const link = document.getElementById('gameLink').value.trim();

            if(!title) { alert('দয়া করে গেমের নাম লিখুন!'); return; }

            let gamePayload = {
                title: title,
                desc: desc,
                thumb: thumb,
                type: currentType,
                content: currentType === 'html' ? code : link,
                createdAt: Date.now()
            };

            if(currentType === 'html' && !code.trim()) { alert('দয়া করে HTML কোড পেস্ট করুন!'); return; }
            if(currentType === 'link' && !link) { alert('দয়া করে গেমের লিংক দিন!'); return; }

            db.ref('custom_games').push(gamePayload)
              .then(() => {
                  alert('✅ গেম সফলভাবে যুক্ত হয়েছে!');
                  document.getElementById('gameTitle').value = '';
                  document.getElementById('gameDesc').value = '';
                  document.getElementById('gameThumb').value = '';
                  document.getElementById('gameCode').value = '';
                  document.getElementById('gameLink').value = '';
              })
              .catch(err => alert('ত্রুটি: ' + err.message));
        }

        // Delete Game
        function deleteGame(key) {
            if(confirm('আপনি কি নিশ্চিত যে এই গেমটি মুছে ফেলতে চান?')) {
                db.ref('custom_games/' + key).remove();
            }
        }

        // Listen for Realtime Games List
        db.ref('custom_games').on('value', snapshot => {
            const container = document.getElementById('gamesContainer');
            const data = snapshot.val();
            container.innerHTML = '';

            if(!data) {
                container.innerHTML = '<div style="color:#8893a2; text-align:center; padding:30px; font-size:13px;">এখনো কোনো গেম যুক্ত করা হয়নি।</div>';
                document.getElementById('gameCount').innerText = '0';
                return;
            }

            const keys = Object.keys(data);
            document.getElementById('gameCount').innerText = keys.length;

            keys.forEach(key => {
                const g = data[key];
                const item = document.createElement('div');
                item.className = 'game-item';
                item.innerHTML = `
                    <div class="game-item-info">
                        <img src="${g.thumb}" class="game-thumb" onerror="this.src='https://uploads.onecompiler.io/443fxwbzx/44kbmurbf/1Win_icon-removebg-preview.png'">
                        <div>
                            <div class="game-item-title">${g.title}</div>
                            <span class="game-item-tag">${g.type.toUpperCase()}</span>
                        </div>
                    </div>
                    <button class="btn-delete" onclick="deleteGame('${key}')" title="Delete Game"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(item);
            });
        });
    </script>
</body>
</html>
