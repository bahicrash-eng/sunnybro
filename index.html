<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1WIN | Ultimate Gaming Hub</title>
    
    <!-- Web Favicon -->
    <link rel="icon" type="image/png" href="https://uploads.onecompiler.io/443fxwbzx/44kbmurbf/1Win_icon-removebg-preview.png">
    <link rel="shortcut icon" type="image/png" href="https://uploads.onecompiler.io/443fxwbzx/44kbmurbf/1Win_icon-removebg-preview.png">
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root {
            --bg-base: #07090e;
            --surface-1: #0f131d;
            --surface-2: #161b26;
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 210, 255, 0.4);
            --primary-gradient: linear-gradient(135deg, #0072ff 0%, #00d2ff 100%);
            --accent-glow: rgba(0, 210, 255, 0.25);
            --accent-green: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 114, 255, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 75, 43, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ambient Glow Background Element */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 114, 255, 0.18), transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        /* TOP NAVIGATION / STATUS BAR */
        .top-nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            background: rgba(7, 9, 14, 0.6);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        .brand img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 114, 255, 0.6));
        }

        .brand-text {
            background: linear-gradient(90deg, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-badge {
            background: var(--primary-gradient);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
        }

        .live-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }

        /* LOBBY SCREEN */
        #lobby-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding: 40px 20px 60px;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero-banner {
            text-align: center;
            max-width: 650px;
            margin-bottom: 45px;
        }

        .hero-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(0, 114, 255, 0.1);
            border: 1px solid rgba(0, 114, 255, 0.3);
            color: #38bdf8;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .hero-banner h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.15;
            background: linear-gradient(180deg, #FFFFFF 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .hero-banner p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
        }

        /* GAMES GRID */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 26px;
            width: 100%;
            max-width: 1200px;
        }

        /* MODERN GAME CARD */
        .game-card {
            position: relative;
            background: linear-gradient(180deg, rgba(22, 27, 38, 0.8) 0%, rgba(15, 19, 29, 0.95) 100%);
            border-radius: 20px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            pointer-events: none;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px var(--accent-glow);
        }

        .card-preview {
            position: relative;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1a2233 0%, #0c1017 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        .card-preview img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.6));
        }

        .game-card:hover .card-preview img {
            transform: scale(1.15) rotate(2deg);
        }

        .card-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .game-name {
            font-family: 'Outfit', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }

        .game-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .play-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: var(--primary-gradient);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(0, 114, 255, 0.35);
            transition: all 0.25s ease;
        }

        .play-btn i {
            font-size: 12px;
            transition: transform 0.2s ease;
        }

        .game-card:hover .play-btn {
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
            filter: brightness(1.1);
        }

        .game-card:hover .play-btn i {
            transform: translateX(4px);
        }

        /* EMPTY & LOADER STATES */
        .state-container {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 70px 20px;
            text-align: center;
            background: rgba(15, 19, 29, 0.4);
            border: 1px dashed var(--border-glass);
            border-radius: 20px;
        }

        .loader-ring {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(0, 210, 255, 0.15);
            border-top: 3px solid #00d2ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* FULLSCREEN GAME VIEW */
        #game-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 10000;
            flex-direction: column;
        }

        .floating-back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 999999;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            transition: all 0.25s ease;
        }

        .floating-back-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
            background: #000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Ambient Gradient Element -->
    <div class="ambient-glow"></div>

    <!-- TOP NAVIGATION -->
    <nav class="top-nav">
        <div class="brand">
            <img src="https://uploads.onecompiler.io/443fxwbzx/44kbmurbf/1Win_icon-removebg-preview.png" alt="1Win Icon">
            <span class="brand-text">1WIN</span>
            <span class="brand-badge">PRO</span>
        </div>
        <div class="live-status">
            <span class="status-dot"></span>
            <span>SYSTEM ONLINE</span>
        </div>
    </nav>

    <!-- LOBBY SCREEN -->
    <div id="lobby-container">
        <div class="hero-banner">
            <span class="hero-badge"><i class="fa-solid fa-bolt-lightning"></i> Official Entertainment Hub</span>
            <h1>Explore Premium Games</h1>
            <p>Select your favorite gaming title to launch into ultra-fast, seamless real-time gameplay.</p>
        </div>

        <div class="games-grid" id="gamesHub">
            <div class="state-container">
                <div class="loader-ring"></div>
                <p style="color: var(--text-secondary); font-size: 14px; font-weight: 500;">Connecting to cloud servers...</p>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN GAME VIEW -->
    <div id="game-view">
        <button class="floating-back-btn" onclick="exitToLobby()">
            <i class="fa-solid fa-arrow-left"></i> Exit to Lobby
        </button>
        <iframe id="game-frame" allowfullscreen="true" allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>

    <script>
        // Firebase Setup
        const firebaseConfig = {
          apiKey: "AIzaSyCV8gnfgtQjA-IBrfV4aJdz2agbhXnML2I",
          authDomain: "sunnyfuther.firebaseapp.com",
          databaseURL: "https://sunnyfuther-default-rtdb.firebaseio.com",
          projectId: "sunnyfuther",
          storageBucket: "sunnyfuther.firebasestorage.app",
          messagingSenderId: "1058855642796",
          appId: "1:1058855642796:web:6ffff989a42905f8b7e109"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let loadedGames = {};

        // Realtime Games Listener
        db.ref('custom_games').on('value', snapshot => {
            const container = document.getElementById('gamesHub');
            const data = snapshot.val();
            container.innerHTML = '';
            loadedGames = data || {};

            if(!data) {
                container.innerHTML = `
                    <div class="state-container">
                        <i class="fa-solid fa-gamepad" style="font-size: 32px; color: var(--text-muted); margin-bottom: 12px;"></i>
                        <h4 style="font-size: 16px; margin-bottom: 6px; color: #fff;">No Games Available</h4>
                        <p style="color: var(--text-secondary); font-size: 13px;">Please add games from the management dashboard.</p>
                    </div>`;
                return;
            }

            Object.keys(data).forEach(key => {
                const g = data[key];
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => launchGame(key);

                card.innerHTML = `
                    <div class="card-preview">
                        <span class="card-tag">Online</span>
                        <img src="${g.thumb}" onerror="this.src='https://uploads.onecompiler.io/443fxwbzx/44kbmurbf/1Win_icon-removebg-preview.png'" alt="${g.title}">
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="game-name">${g.title}</div>
                            <div class="game-desc">${g.desc || 'Premium online gaming experience'}</div>
                        </div>
                        <button class="play-btn">
                            Launch Game <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        });

        // Launch Game Logic (Supports HTML Code & Direct Web Links)
        function launchGame(key) {
            const game = loadedGames[key];
            if(!game) return;

            const frame = document.getElementById('game-frame');
            const lobby = document.getElementById('lobby-container');
            const gameView = document.getElementById('game-view');

            if(game.type === 'html') {
                frame.removeAttribute('src');
                frame.srcdoc = game.content;
            } else if(game.type === 'link') {
                frame.removeAttribute('srcdoc');
                frame.src = game.content;
            }

            lobby.style.display = 'none';
            gameView.style.display = 'flex';
        }

        // Return to Lobby
        function exitToLobby() {
            const frame = document.getElementById('game-frame');
            const lobby = document.getElementById('lobby-container');
            const gameView = document.getElementById('game-view');

            frame.src = 'about:blank';
            frame.removeAttribute('srcdoc');
            gameView.style.display = 'none';
            lobby.style.display = 'flex';
        }
    </script>
</body>
</html>
